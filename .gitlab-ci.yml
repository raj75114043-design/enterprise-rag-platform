# GitLab CI mirror of the GitHub Actions quality pipeline
stages: [quality, integration]

default:
  image: python:3.11-slim
  cache: {key: pip, paths: [.cache/pip]}
  before_script:
    - pip install -r requirements-dev.txt

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  LLM_PROVIDER: none

quality:
  stage: quality
  script:
    - ruff check .
    - pytest -q
    - python -m ragp.eval.run --gate
  artifacts: {paths: [reports/eval.json], expire_in: 30 days}

integration-postgres:
  stage: integration
  services: [{name: "postgres:16-alpine", alias: postgres}]
  variables: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag, DATABASE_URL: "postgresql+psycopg://rag:rag@postgres:5432/rag"}
  script:
    - python -m ragp.cli ingest
    - python -m ragp.eval.run --gate
